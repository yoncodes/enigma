<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enigma MUIP</title>
  <style>
    body { margin: 0; font-family: Segoe UI, sans-serif; background: #111318; color: #ece7de; }
    main { max-width: 880px; margin: 40px auto; padding: 0 20px; }
    input, button { min-width: 0; font: inherit; border: 1px solid #393d46; background: #1c2028; color: #ece7de; padding: 10px 12px; box-sizing: border-box; }
    button { cursor: pointer; background: #394150; }
    .grid { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .grant { margin-top: 14px; display: grid; gap: 10px; grid-template-columns: 150px minmax(130px, .8fr) minmax(180px, 1.2fr) 90px auto; }
    .dungeon { margin-top: 10px; display: grid; gap: 10px; grid-template-columns: minmax(150px, 1fr) 110px minmax(180px, 1.4fr) auto; }
    .grant > *, .dungeon > *, .grid > *, .cmd > * { min-width: 0; }
    select { min-width: 0; max-width: 100%; font: inherit; border: 1px solid #393d46; background: #1c2028; color: #ece7de; padding: 10px 12px; box-sizing: border-box; text-overflow: ellipsis; }
    .cmd { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .top h1 { margin: 0; }
    .online { display: inline-flex; align-items: center; gap: 8px; border: 1px solid #393d46; background: #181b22; padding: 8px 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #c84747; box-shadow: 0 0 12px #c84747; }
    .online.is-online .dot { background: #4fb86a; box-shadow: 0 0 12px #4fb86a; }
    .status { margin: 14px 0; display: flex; gap: 12px; flex-wrap: wrap; color: #aeb6c4; }
    .status span { border: 1px solid #393d46; background: #181b22; padding: 6px 10px; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #1c2028; border: 1px solid #393d46; padding: 16px; min-height: 180px; }
    @media (max-width: 640px) { .top { align-items: flex-start; flex-direction: column; } .grid, .cmd, .grant, .dungeon { display: block; } input, button, select { width: 100%; box-sizing: border-box; margin: 0 0 10px; } }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <h1>Enigma MUIP</h1>
      <div id="onlineState" class="online">
        <span class="dot"></span>
        <span id="onlineText">Offline</span>
      </div>
    </div>
    <div class="grid">
      <input id="token" placeholder="admin token" value="__MUIP_TOKEN__">
      <input id="uid" placeholder="player uid (blank = online)">
      <div class="cmd">
        <input id="command" placeholder="material 2 4 1000">
        <button onclick="run()">Run</button>
      </div>
    </div>
    <div class="grant">
      <select id="kind"></select>
      <input id="materialSearch" placeholder="search id or name">
      <select id="material"></select>
      <input id="amount" type="number" min="1" step="1" value="1">
      <button id="grant" type="button" onclick="grantSelected()">Grant</button>
    </div>
    <div class="dungeon">
      <select id="dungeonChapter"></select>
      <select id="dungeonKind">
        <option value="chapter">Whole chapter</option>
        <option value="stage">Stage</option>
      </select>
      <select id="dungeonEpisode"></select>
      <button type="button" onclick="unlockDungeon()">Unlock selected</button>
    </div>
    <div class="dungeon">
      <button type="button" onclick="completeGuides()">Complete all guides</button>
      <button type="button" onclick="unlockBgms()">Unlock all BGM</button>
    </div>
    <div class="status">
      <span id="server">server: checking</span>
      <span id="players">players: checking</span>
    </div>
    <pre id="out">commands: help, status, players, bgm unlock all, guide complete all, dungeon unlock &lt;stage|chapter&gt; &lt;id&gt;, material &lt;type&gt; &lt;id&gt; &lt;amount&gt;</pre>
  </main>
  <script>
    document.getElementById('token').value = localStorage.getItem('enigmaMuipToken') || '__MUIP_TOKEN__';
    let statusTimer = 0;
    const catalog = { types: [], items: [] };
    const dungeonCatalog = { chapters: [], episodes: [] };
    const out = document.getElementById('out');
    async function refreshStatus() {
      try {
        clearTimeout(statusTimer);
        const statusRes = await fetch('/api/status', { cache: 'no-store' });
        const status = await statusRes.json();
        const players = status.players || [];
        const isOnline = (status.online || 0) > 0;
        document.getElementById('onlineState').classList.toggle('is-online', isOnline);
        document.getElementById('onlineText').textContent = isOnline ? 'Online' : 'Offline';
        document.getElementById('server').textContent =
          `server: ${status.status || 'online'} (${status.online || 0} online)`;
        document.getElementById('players').textContent =
          players.length === 0
            ? 'players: none'
            : `players: ${players.join(', ')}`;
        const uid = document.getElementById('uid');
        if (!uid.value && players.length === 1) {
          uid.value = players[0];
          uid.placeholder = 'player uid';
        } else {
          uid.placeholder = 'player uid (blank = online)';
        }
        statusTimer = setTimeout(refreshStatus, isOnline ? 15000 : 3000);
      } catch {
        document.getElementById('onlineState').classList.remove('is-online');
        document.getElementById('onlineText').textContent = 'Offline';
        document.getElementById('server').textContent = 'server: offline';
        document.getElementById('players').textContent = 'players: unknown';
        statusTimer = setTimeout(refreshStatus, 3000);
      }
    }
    async function loadTypes() {
      try {
        const res = await fetch('/api/materials');
        if (!res.ok) throw new Error(`catalog failed: ${res.status}`);
        const data = await res.json();
        catalog.types = data.types || [];
        const kind = document.getElementById('kind');
        kind.innerHTML = catalog.types.map(x => `<option value="${x.type}">${x.name}</option>`).join('');
        await loadMaterials();
      } catch (err) {
        out.textContent = `Failed to load material catalog: ${err.message}`;
      }
    }
    async function loadMaterials() {
      try {
        const type = document.getElementById('kind').value;
        if (!type) return;
        const q = document.getElementById('materialSearch').value;
        const params = new URLSearchParams({ type, q, limit: 500 });
        const uid = document.getElementById('uid').value.trim();
        if (type === '5') {
          params.set('unowned_only', 'true');
          if (uid) params.set('player_uid', uid);
        }
        const res = await fetch('/api/materials?' + params);
        if (!res.ok) throw new Error(`materials failed: ${res.status}`);
        const data = await res.json();
        catalog.items = data.items || [];
        const material = document.getElementById('material');
        material.innerHTML = catalog.items.length === 0
          ? '<option value="">No matches</option>'
          : catalog.items
            .map(x => `<option value="${x.id}">${x.id} - ${escapeHtml(x.name)}</option>`)
            .join('');
        updateCommandPreview();
      } catch (err) {
        out.textContent = `Failed to load materials: ${err.message}`;
      }
    }
    async function loadDungeons() {
      try {
        const res = await fetch('/api/dungeons', { cache: 'no-store' });
        if (!res.ok) throw new Error(`dungeon catalog failed: ${res.status}`);
        const data = await res.json();
        dungeonCatalog.chapters = data.chapters || [];
        dungeonCatalog.episodes = data.episodes || [];
        const chapters = document.getElementById('dungeonChapter');
        chapters.innerHTML = dungeonCatalog.chapters
          .map(x => `<option value="${x.id}">${x.id} - ${escapeHtml(x.name || `Chapter ${x.id}`)}</option>`)
          .join('');
        loadDungeonEpisodes();
      } catch (err) {
        out.textContent = `Failed to load dungeon catalog: ${err.message}`;
      }
    }
    function loadDungeonEpisodes() {
      const chapterId = Number(document.getElementById('dungeonChapter').value || 0);
      const episodes = dungeonCatalog.episodes.filter(x => x.chapterId === chapterId);
      document.getElementById('dungeonEpisode').innerHTML = episodes
        .map(x => `<option value="${x.id}">${x.id} - ${escapeHtml(x.name || `Episode ${x.id}`)}</option>`)
        .join('');
      updateDungeonMode();
    }
    function updateDungeonMode() {
      const kind = document.getElementById('dungeonKind').value;
      document.getElementById('dungeonEpisode').disabled = kind !== 'stage';
    }
    async function unlockDungeon() {
      const kind = document.getElementById('dungeonKind').value;
      const id = kind === 'chapter'
        ? document.getElementById('dungeonChapter').value
        : document.getElementById('dungeonEpisode').value;
      if (!id) {
        out.textContent = `Pick a ${kind} first.`;
        return;
      }
      document.getElementById('command').value = `dungeon unlock ${kind} ${id}`;
      await run();
    }
    async function completeGuides() {
      document.getElementById('command').value = 'guide complete all';
      await run();
    }
    async function unlockBgms() {
      document.getElementById('command').value = 'bgm unlock all';
      await run();
    }
    function selectedMaterial() {
      const id = Number(document.getElementById('material').value || 0);
      return catalog.items.find(x => x.id === id);
    }
    async function grantSelected() {
      try {
        const item = selectedMaterial();
        if (!item) {
          out.textContent = 'Pick an item from the dropdown first.';
          return;
        }
        const amount = Math.max(1, Number(document.getElementById('amount').value || 1));
        document.getElementById('command').value = `material ${item.type} ${item.id} ${amount}`;
        await run();
      } catch (err) {
        out.textContent = `Grant failed before request: ${err.message}`;
      }
    }
    function updateCommandPreview() {
      const item = selectedMaterial();
      if (!item) return;
      const amount = Math.max(1, Number(document.getElementById('amount').value || 1));
      document.getElementById('command').value = `material ${item.type} ${item.id} ${amount}`;
    }
    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }
    async function run() {
      const token = document.getElementById('token').value;
      localStorage.setItem('enigmaMuipToken', token);
      const params = new URLSearchParams({
        token,
        command: document.getElementById('command').value
      });
      const uid = document.getElementById('uid').value.trim();
      if (uid) params.set('player_uid', uid);
      const res = await fetch('/muip/gm?' + params);
      out.textContent = JSON.stringify(await res.json(), null, 2);
      refreshStatus();
    }
    document.getElementById('kind').addEventListener('change', () => {
      document.getElementById('materialSearch').value = '';
      loadMaterials();
    });
    document.getElementById('materialSearch').addEventListener('input', () => {
      clearTimeout(window.materialTimer);
      window.materialTimer = setTimeout(loadMaterials, 150);
    });
    document.getElementById('material').addEventListener('change', updateCommandPreview);
    document.getElementById('amount').addEventListener('input', updateCommandPreview);
    document.getElementById('dungeonKind').addEventListener('change', updateDungeonMode);
    document.getElementById('dungeonChapter').addEventListener('change', loadDungeonEpisodes);
    loadTypes();
    loadDungeons();
    refreshStatus();
  </script>
</body>
</html>
